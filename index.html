<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ali & Farah | Engagement Party</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Intro -->

<div id="intro">

    <div class="intro-content">

        <h1>Ali</h1>

        <div class="intro-amp">&</div>

        <h1>Farah</h1>

        <p>Engagement Party</p>

    </div>

</div>

<!-- Main Card -->

<div class="card">

    <img
    src="images/flowers-top.png"
    class="flower flower-top"
    alt="">

    <img
    src="images/flowers-bottom.png"
    class="flower flower-bottom"
    alt="">

    <h1 class="names">

        <span>Ali</span>

        <span class="amp">&</span>

        <span>Farah</span>

    </h1>

    <p class="subtitle">

        Every picture tells a part of our story.

        <br><br>

        Thank you for celebrating with us.

    </p>

    <!-- Countdown -->

    <div id="countdown">

        <div class="count-box">

            <span id="days">00</span>

            <small>Days</small>

        </div>

        <div class="count-box">

            <span id="hours">00</span>

            <small>Hours</small>

        </div>

        <div class="count-box">

            <span id="minutes">00</span>

            <small>Minutes</small>

        </div>

        <div class="count-box">

            <span id="seconds">00</span>

            <small>Seconds</small>

        </div>

    </div>

    <!-- Upload -->

    <input
    type="file"
    id="photoInput"
    accept="image/*"
    multiple
    hidden>

    <button
    id="uploadBtn"
    class="upload-btn">

        <div class="camera-circle">

            📸

        </div>

        <span class="upload-title">

            Share Your Memories

        </span>

        <span class="upload-subtitle">

            Upload up to 50 Photos

        </span>

    </button>

    <p id="status" class="status">

        Choose your favourite moments ❤️

    </p>

    <div class="footer">

        Ali & Farah

        <br>

        Engagement Party

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
