<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ali & Farah | Wedding Photos</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

<div class="logo">AF</div>

& <br>

<script src="script.js"></script>

</html>
